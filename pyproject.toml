[project]
name = "wallet-service"
version = "1.0.0"
description = "Concurrency-safe, idempotent wallet debits on Django REST Framework and PostgreSQL."
requires-python = ">=3.11"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "concurrency: exercises real parallel database sessions (PostgreSQL only)",
]

[tool.coverage.run]
source = ["wallets", "config"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
